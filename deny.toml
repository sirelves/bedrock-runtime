# cargo-deny — roda em CI e bloqueia merge (ver SECURITY.md).
# Toda dependencia nova e superficie de ataque herdada e exige justificativa no PR.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
# Compativel com a licenca MIT do projeto (ver ADR-007).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots: the Mozilla CA bundle. A data licence on certificates, not code.
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
