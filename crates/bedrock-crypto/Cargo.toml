[package]
name = "bedrock-crypto"
description = "Session cryptography: key agreement, key derivation, stream cipher. Primitives only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aes = "0.8"
ctr = "0.9"
ring = "0.17"
subtle = "2"
p384 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[lints]
workspace = true
